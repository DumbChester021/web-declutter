<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <style>
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                width: 300px;
                padding: 15px;
                color: #333;
                margin: 0;
            }
            h3 {
                margin-top: 0;
                color: #1877f2;
                font-size: 16px;
                border-bottom: 1px solid #ddd;
                padding-bottom: 8px;
                margin-bottom: 10px;
            }
            .stat-container {
                display: flex;
                justify-content: space-between;
                border-bottom: 1px solid #eee;
                padding-bottom: 10px;
                margin-bottom: 10px;
            }
            .stat-box {
                text-align: center;
            }
            .stat-title {
                font-size: 11px;
                color: #65676b;
                text-transform: uppercase;
            }
            .number {
                font-weight: bold;
                color: #e41e3f;
                font-size: 18px;
            }

            h4 {
                font-size: 13px;
                margin: 0 0 5px 0;
                color: #444;
            }
            #history-list {
                max-height: 180px;
                overflow-y: auto;
                background: #f0f2f5;
                border-radius: 6px;
                padding: 5px;
                font-size: 12px;
            }
            .history-item {
                padding: 6px;
                border-bottom: 1px solid #ddd;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .history-item:last-child {
                border-bottom: none;
            }
            .history-name {
                font-weight: bold;
                color: #1877f2;
                text-decoration: none;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 140px;
            }
            .history-name:hover {
                text-decoration: underline;
            }
            .history-time {
                color: #888;
                font-size: 10px;
            }

            button {
                width: 100%;
                padding: 8px;
                margin-top: 12px;
                border: none;
                background: #e4e6e9;
                border-radius: 6px;
                cursor: pointer;
                font-weight: bold;
                color: #4b4f56;
            }
            button:hover {
                background: #d8dadf;
            }
        </style>
    </head>
    <body>
        <h3>FB Feed Cleaner</h3>

        <div class="stat-container">
            <div class="stat-box">
                <div class="number" id="session">0</div>
                <div class="stat-title">This Tab</div>
            </div>
            <div class="stat-box">
                <div class="number" id="overall">0</div>
                <div class="stat-title">All-Time</div>
            </div>
            <div class="stat-box">
                <div class="number" style="color: #1877f2" id="whitelist-count">
                    0
                </div>
                <div class="stat-title">Whitelisted</div>
            </div>
        </div>

        <h4>Recently Blocked</h4>
        <div id="history-list">
            <!-- History items will be injected here -->
        </div>

        <button id="clear-data">Clear Whitelist & History</button>

        <script src="popup.js"></script>
    </body>
</html>
